#
# DKMS configuration for the casfs kernel module. Use `make dkms-install`
# (scripts/dkms.sh), which copies the sources to /usr/src/casfs-<version>,
# fills in #MODULE_VERSION# and generates version.h before handing the tree to
# DKMS. DKMS then builds the module with Kbuild directly
# (make -C <kernel build dir> M=<dkms build dir>), so version.h must already
# exist in the source tree.
PACKAGE_NAME="casfs"
PACKAGE_VERSION="#MODULE_VERSION#"
BUILT_MODULE_NAME[0]="casfs"
# Required by DKMS parser validation, but DKMS may override it
DEST_MODULE_LOCATION[0]="/kernel/fs/casfs"
# Tell DKMS to re-install when kernel changes
AUTOINSTALL="yes"
